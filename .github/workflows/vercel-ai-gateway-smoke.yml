name: Vercel AI Gateway smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/vercel-ai-gateway
    paths:
      - .github/workflows/vercel-ai-gateway-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - name: Verify secret is available
        shell: bash
        run: |
          if [[ -z "$AI_GATEWAY_API_KEY" ]]; then
            echo "AI_GATEWAY_API_KEY is not available to this repository"
            exit 1
          fi

      - name: Call Vercel AI Gateway
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $AI_GATEWAY_API_KEY" \
            -H "Content-Type: application/json" \
            https://ai-gateway.vercel.sh/v1/models > /tmp/models.json

          MODEL=$(python3 - <<'PY'
          import json

          with open('/tmp/models.json', encoding='utf-8') as fh:
              models = json.load(fh).get('data', [])

          language = [
              model for model in models
              if model.get('type') == 'language'
              and 'text' in model.get('modalities', {}).get('output', ['text'])
          ]
          preferred = next((m for m in language if m.get('id') == 'alibaba/qwen-3-14b'), None)
          if preferred is None:
              def cost(model):
                  pricing = model.get('pricing') or {}
                  try:
                      return float(pricing.get('input', 'inf')) + float(pricing.get('output', 'inf'))
                  except (TypeError, ValueError):
                      return float('inf')
              language.sort(key=cost)
              preferred = language[0] if language else None

          if preferred is None:
              raise SystemExit('No text language model found in Vercel AI Gateway catalog')

          print(preferred['id'])
          PY
          )

          echo "Smoke model: $MODEL"
          export MODEL
          python3 - <<'PY' > /tmp/request.json
          import json, os
          print(json.dumps({
              'model': os.environ['MODEL'],
              'messages': [{'role': 'user', 'content': 'Reply with exactly OK.'}],
              'max_tokens': 8,
              'stream': False,
          }))
          PY

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $AI_GATEWAY_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/request.json \
            https://ai-gateway.vercel.sh/v1/chat/completions > /tmp/response.json

          python3 - <<'PY'
          import json
          with open('/tmp/response.json', encoding='utf-8') as fh:
              response = json.load(fh)
          choices = response.get('choices') or []
          if not choices:
              raise SystemExit(f'No choices in gateway response: {response}')
          content = choices[0].get('message', {}).get('content')
          if not content:
              raise SystemExit(f'No text content in gateway response: {response}')
          print(f'Gateway response: {content!r}')
          PY
